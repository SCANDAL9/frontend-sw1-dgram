@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs animate-in fade-in duration-200">
    <!-- Backdrop Click to Close -->
    <div class="fixed inset-0" (click)="close.emit()"></div>

    <!-- Modal Box -->
    <div
      class="relative w-full max-w-md bg-card border border-border rounded-2xl shadow-2xl overflow-hidden p-6 z-10 flex flex-col gap-5 animate-in zoom-in-95 duration-200"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="flex items-start justify-between">
        <div class="flex items-center gap-3">
          <div class="size-10 rounded-xl bg-primary/10 border border-primary/20 flex items-center justify-center text-primary">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </div>
          <div>
            <h3 class="text-base font-semibold text-foreground tracking-tight">Exportar {{ getFormatLabel() }}</h3>
            <p class="text-xs text-muted-foreground mt-0.5">Elige el alcance de los elementos a exportar</p>
          </div>
        </div>

        <button
          class="size-7 rounded-lg hover:bg-muted text-muted-foreground hover:text-foreground flex items-center justify-center transition-colors cursor-pointer"
          (click)="close.emit()"
          title="Cerrar"
        >
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <!-- Scope Options -->
      <div class="flex flex-col gap-3">
        <!-- Option 1: Solo seleccionados -->
        <button
          type="button"
          class="group relative flex items-start gap-4 p-4 rounded-xl border border-primary/30 bg-primary/5 hover:bg-primary/10 hover:border-primary transition-all cursor-pointer text-left shadow-xs active:scale-[0.99]"
          (click)="scopeSelected.emit('selected')"
        >
          <div class="size-9 rounded-lg bg-primary text-primary-foreground flex items-center justify-center shrink-0 shadow-sm mt-0.5">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <span class="text-sm font-semibold text-foreground group-hover:text-primary transition-colors">Solo seleccionados</span>
              <span class="px-2 py-0.5 text-[10px] font-mono font-medium rounded-full bg-primary/20 text-primary">
                {{ selectedCount() }} {{ selectedCount() === 1 ? 'clase' : 'clases' }}
              </span>
            </div>
            <p class="text-xs text-muted-foreground mt-1 leading-relaxed">
              Exporta únicamente las clases que tienes seleccionadas y sus relaciones entre sí.
            </p>
          </div>
        </button>

        <!-- Option 2: Todos -->
        <button
          type="button"
          class="group relative flex items-start gap-4 p-4 rounded-xl border border-border bg-card hover:bg-muted/60 hover:border-border/80 transition-all cursor-pointer text-left shadow-xs active:scale-[0.99]"
          (click)="scopeSelected.emit('all')"
        >
          <div class="size-9 rounded-lg bg-muted text-foreground flex items-center justify-center shrink-0 shadow-2xs mt-0.5">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="2" y1="12" x2="22" y2="12" />
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <span class="text-sm font-semibold text-foreground group-hover:text-foreground transition-colors">Todos</span>
              <span class="px-2 py-0.5 text-[10px] font-mono font-medium rounded-full bg-muted text-muted-foreground">
                {{ totalCount() }} {{ totalCount() === 1 ? 'clase' : 'clases' }}
              </span>
            </div>
            <p class="text-xs text-muted-foreground mt-1 leading-relaxed">
              Exporta el diagrama completo con todas sus entidades y relaciones.
            </p>
          </div>
        </button>
      </div>

      <!-- Footer -->
      <div class="flex justify-end pt-2">
        <button
          type="button"
          class="px-4 py-2 text-xs font-medium text-muted-foreground hover:text-foreground rounded-lg hover:bg-muted transition-colors cursor-pointer"
          (click)="close.emit()"
        >
          Cancelar
        </button>
      </div>
    </div>
  </div>
}
