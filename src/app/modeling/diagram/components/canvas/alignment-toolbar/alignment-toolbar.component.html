@if (selectedCount >= 2) {
  <div class="fixed bottom-8 left-1/2 -translate-x-1/2 z-40 bg-zinc-900/95 dark:bg-zinc-900/98 backdrop-blur-md text-white px-3 py-1.5 rounded-2xl shadow-2xl border border-white/10 flex items-center gap-1 animate-in slide-in-from-bottom-3 duration-150">
    <span class="text-xs font-semibold text-zinc-400 px-2 border-r border-white/10 shrink-0">
      {{ selectedCount }} seleccionados
    </span>

    <!-- Align Left -->
    <button (click)="align.emit('left')" class="p-1.5 rounded-lg hover:bg-white/15 text-zinc-300 hover:text-white transition-colors cursor-pointer" title="Alinear a la izquierda">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16M8 7h12M8 17h8"/></svg>
    </button>
    <!-- Align Center H -->
    <button (click)="align.emit('centerH')" class="p-1.5 rounded-lg hover:bg-white/15 text-zinc-300 hover:text-white transition-colors cursor-pointer" title="Alinear al centro horizontal">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M6 8h12M8 16h8"/></svg>
    </button>
    <!-- Align Right -->
    <button (click)="align.emit('right')" class="p-1.5 rounded-lg hover:bg-white/15 text-zinc-300 hover:text-white transition-colors cursor-pointer" title="Alinear a la derecha">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 4v16M4 7h12M8 17h8"/></svg>
    </button>

    <div class="w-px h-4 bg-white/15 mx-0.5 shrink-0"></div>

    <!-- Align Top -->
    <button (click)="align.emit('top')" class="p-1.5 rounded-lg hover:bg-white/15 text-zinc-300 hover:text-white transition-colors cursor-pointer" title="Alinear arriba">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16M7 8v12M17 8v8"/></svg>
    </button>
    <!-- Align Center V -->
    <button (click)="align.emit('centerV')" class="p-1.5 rounded-lg hover:bg-white/15 text-zinc-300 hover:text-white transition-colors cursor-pointer" title="Alinear al centro vertical">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M8 6v12M16 8v8"/></svg>
    </button>
    <!-- Align Bottom -->
    <button (click)="align.emit('bottom')" class="p-1.5 rounded-lg hover:bg-white/15 text-zinc-300 hover:text-white transition-colors cursor-pointer" title="Alinear abajo">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16M7 4v12M17 8v8"/></svg>
    </button>

    @if (selectedCount >= 3) {
      <div class="w-px h-4 bg-white/15 mx-0.5 shrink-0"></div>
      <!-- Distribute H -->
      <button (click)="distribute.emit('h')" class="p-1.5 rounded-lg hover:bg-white/15 text-zinc-300 hover:text-white transition-colors cursor-pointer" title="Distribuir horizontalmente de forma uniforme">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="4" height="12" rx="1"/><rect x="16" y="6" width="4" height="12" rx="1"/><path d="M12 4v16"/></svg>
      </button>
      <!-- Distribute V -->
      <button (click)="distribute.emit('v')" class="p-1.5 rounded-lg hover:bg-white/15 text-zinc-300 hover:text-white transition-colors cursor-pointer" title="Distribuir verticalmente de forma uniforme">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="12" height="4" rx="1"/><rect x="6" y="16" width="12" height="4" rx="1"/><path d="M4 12h16"/></svg>
      </button>
    }
  </div>
}
