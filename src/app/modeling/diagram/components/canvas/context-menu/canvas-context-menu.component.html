@if (menu(); as m) {
  <div
    class="fixed z-50 bg-popover text-popover-foreground border border-border rounded-xl shadow-2xl p-1 w-52 text-[12px] animate-fadeIn select-none"
    [style.left.px]="m.x"
    [style.top.px]="m.y"
    (click)="$event.stopPropagation()"
  >
    @if (m.entityId) {
      @if (entityName()) {
        <div class="px-3 py-1.5 font-bold text-foreground border-b border-border truncate">
          {{ entityName() }}
        </div>
      }
      <button
        type="button"
        class="w-full flex items-center gap-2 text-left px-3 py-1.5 hover:bg-accent hover:text-accent-foreground rounded-lg cursor-pointer transition-colors"
        (click)="inspectEntity.emit(m.entityId); closed.emit()"
      >
        <svg class="size-3.5 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Inspeccionar Atributos</span>
      </button>
      <button
        type="button"
        class="w-full flex items-center gap-2 text-left px-3 py-1.5 hover:bg-accent hover:text-accent-foreground rounded-lg cursor-pointer transition-colors"
        (click)="duplicateEntity.emit(); closed.emit()"
      >
        <svg class="size-3.5 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>Duplicar Clase</span>
      </button>
      <div class="h-px bg-border my-0.5"></div>
      <button
        type="button"
        class="w-full flex items-center gap-2 text-left px-3 py-1.5 text-amber-500 hover:bg-amber-500/10 rounded-lg cursor-pointer text-[11.5px] transition-colors"
        (click)="detachEntity.emit(m.entityId); closed.emit()"
        title="Quita la clase del tablero actual pero la conserva en el catálogo del proyecto"
      >
        <svg class="size-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        <span>Quitar del Tablero</span>
      </button>
      <button
        type="button"
        class="w-full flex items-center gap-2 text-left px-3 py-1.5 text-destructive hover:bg-destructive/10 rounded-lg cursor-pointer text-[11.5px] transition-colors"
        (click)="deleteEntityFromModel.emit(m.entityId); closed.emit()"
        title="Elimina la clase completamente del proyecto y de todos los diagramas"
      >
        <svg class="size-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span>Eliminar del Modelo</span>
      </button>
    } @else {
      <button
        type="button"
        class="w-full flex items-center gap-2 text-left px-3 py-1.5 hover:bg-accent hover:text-accent-foreground rounded-lg cursor-pointer transition-colors"
        (click)="openCommandPalette.emit(); closed.emit()"
      >
        <svg class="size-3.5 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Command Palette</span>
      </button>
      <button
        type="button"
        class="w-full flex items-center gap-2 text-left px-3 py-1.5 hover:bg-accent hover:text-accent-foreground rounded-lg cursor-pointer transition-colors"
        (click)="autoLayout.emit(); closed.emit()"
      >
        <svg class="size-3.5 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Auto-Organizar</span>
      </button>
      <button
        type="button"
        class="w-full flex items-center gap-2 text-left px-3 py-1.5 hover:bg-accent hover:text-accent-foreground rounded-lg cursor-pointer transition-colors"
        (click)="fitToScreen.emit(); closed.emit()"
      >
        <svg class="size-3.5 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <span>Ajustar a Pantalla (F)</span>
      </button>
    }
  </div>
}
