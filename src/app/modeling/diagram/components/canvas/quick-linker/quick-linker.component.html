@if (position(); as pos) {
  <div
    class="fixed z-50 bg-popover/95 text-popover-foreground backdrop-blur-md rounded-xl border border-border shadow-2xl p-2 flex flex-col gap-1 min-w-[220px] ring-1 ring-border/50 animate-in fade-in zoom-in-95 duration-150 select-none"
    [style.left.px]="pos.x"
    [style.top.px]="pos.y"
    (click)="$event.stopPropagation()"
  >
    <div class="px-2 py-1 text-[10px] font-bold text-muted-foreground uppercase tracking-wider flex items-center justify-between">
      <span>Quick Linker</span>
      <span class="text-[9px] px-1.5 py-0.5 rounded bg-primary/10 text-primary font-mono font-bold">UML</span>
    </div>
    <button
      type="button"
      (click)="createLinked.emit({ relType: 'Association', classifierType: 'class' })"
      class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-foreground hover:bg-accent transition-colors text-left cursor-pointer active:scale-[0.98]"
    >
      <span class="w-2 h-2 rounded-full bg-primary shrink-0"></span>
      <span>+ Clase Asociada</span>
    </button>
    <button
      type="button"
      (click)="createLinked.emit({ relType: 'Generalization', classifierType: 'class' })"
      class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-foreground hover:bg-accent transition-colors text-left cursor-pointer active:scale-[0.98]"
    >
      <span class="w-2 h-2 rounded-full bg-amber-500 shrink-0"></span>
      <span>+ Subclase (Heredar)</span>
    </button>
    <button
      type="button"
      (click)="createLinked.emit({ relType: 'Realization', classifierType: 'interface' })"
      class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-foreground hover:bg-accent transition-colors text-left cursor-pointer active:scale-[0.98]"
    >
      <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
      <span>+ Interfaz Implementada</span>
    </button>
    <button
      type="button"
      (click)="createLinked.emit({ relType: 'Composition', classifierType: 'class' })"
      class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-foreground hover:bg-accent transition-colors text-left cursor-pointer active:scale-[0.98]"
    >
      <span class="w-2 h-2 rounded-full bg-purple-500 shrink-0"></span>
      <span>+ Composición (Parte)</span>
    </button>
    <button
      type="button"
      (click)="createLinked.emit({ relType: 'Aggregation', classifierType: 'class' })"
      class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-foreground hover:bg-accent transition-colors text-left cursor-pointer active:scale-[0.98]"
    >
      <span class="w-2 h-2 rounded-full bg-sky-500 shrink-0"></span>
      <span>+ Agregación (Contenido)</span>
    </button>
    <div class="h-px bg-border my-0.5"></div>
    <button
      type="button"
      (click)="closed.emit()"
      class="px-2.5 py-1 rounded-md text-[11px] font-medium text-muted-foreground hover:text-foreground hover:bg-muted/50 text-center cursor-pointer transition-colors"
    >
      Cerrar
    </button>
  </div>
}
