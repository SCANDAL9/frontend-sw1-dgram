@if (position(); as pos) {
  <div
    class="fixed z-50 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-2xl p-2 flex flex-col gap-1 min-w-[210px] animate-in fade-in zoom-in-95 duration-100"
    [style.left.px]="pos.x"
    [style.top.px]="pos.y"
    (click)="$event.stopPropagation()"
  >
    <div class="px-2 py-1 text-[10px] font-bold text-zinc-400 uppercase tracking-wider flex items-center justify-between">
      <span>Quick Linker</span>
      <span class="text-[9px] px-1.5 py-0.5 rounded bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 font-mono">EA</span>
    </div>
    <button
      type="button"
      (click)="createLinked.emit({ relType: 'Association', classifierType: 'class' })"
      class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-xs font-medium text-zinc-700 dark:text-zinc-200 hover:bg-blue-50 dark:hover:bg-blue-950/50 hover:text-blue-600 dark:hover:text-blue-400 transition-colors text-left cursor-pointer"
    >
      <span class="w-2 h-2 rounded-full bg-blue-500 shrink-0"></span>
      <span>+ Clase Asociada</span>
    </button>
    <button
      type="button"
      (click)="createLinked.emit({ relType: 'Generalization', classifierType: 'class' })"
      class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-xs font-medium text-zinc-700 dark:text-zinc-200 hover:bg-amber-50 dark:hover:bg-amber-950/50 hover:text-amber-600 dark:hover:text-amber-400 transition-colors text-left cursor-pointer"
    >
      <span class="w-2 h-2 rounded-full bg-amber-500 shrink-0"></span>
      <span>+ Subclase (Heredar)</span>
    </button>
    <button
      type="button"
      (click)="createLinked.emit({ relType: 'Realization', classifierType: 'interface' })"
      class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-xs font-medium text-zinc-700 dark:text-zinc-200 hover:bg-emerald-50 dark:hover:bg-emerald-950/50 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors text-left cursor-pointer"
    >
      <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
      <span>+ Interfaz Implementada</span>
    </button>
    <button
      type="button"
      (click)="createLinked.emit({ relType: 'Composition', classifierType: 'class' })"
      class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-xs font-medium text-zinc-700 dark:text-zinc-200 hover:bg-purple-50 dark:hover:bg-purple-950/50 hover:text-purple-600 dark:hover:text-purple-400 transition-colors text-left cursor-pointer"
    >
      <span class="w-2 h-2 rounded-full bg-purple-500 shrink-0"></span>
      <span>+ Composición (Parte)</span>
    </button>
    <button
      type="button"
      (click)="createLinked.emit({ relType: 'Aggregation', classifierType: 'class' })"
      class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-xs font-medium text-zinc-700 dark:text-zinc-200 hover:bg-sky-50 dark:hover:bg-sky-950/50 hover:text-sky-600 dark:hover:text-sky-400 transition-colors text-left cursor-pointer"
    >
      <span class="w-2 h-2 rounded-full bg-sky-500 shrink-0"></span>
      <span>+ Agregación (Contenido)</span>
    </button>
    <div class="h-px bg-zinc-200 dark:bg-zinc-800 my-0.5"></div>
    <button
      type="button"
      (click)="closed.emit()"
      class="px-2.5 py-1 rounded text-[11px] text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 text-center cursor-pointer"
    >
      Cerrar
    </button>
  </div>
}
