<div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full select-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl shadow-2xl border backdrop-blur-md transition-all duration-300 transform translate-y-0 opacity-100 bg-card/95 text-card-foreground ring-1 ring-border/50"
      [ngClass]="{
        'border-emerald-500/40': toast.type === 'success',
        'border-amber-500/40': toast.type === 'warning',
        'border-destructive/40': toast.type === 'error',
        'border-primary/40': toast.type === 'info'
      }"
    >
      <!-- Icon -->
      <span class="shrink-0 mt-0.5 text-[14px]">
        @if (toast.type === 'success') {
          <svg class="w-4 h-4 text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        } @else if (toast.type === 'warning') {
          <svg class="w-4 h-4 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        } @else if (toast.type === 'error') {
          <svg class="w-4 h-4 text-destructive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        } @else {
          <svg class="w-4 h-4 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        }
      </span>

      <p class="text-[13px] font-medium leading-snug flex-1 text-card-foreground">{{ toast.message }}</p>

      <button
        type="button"
        class="text-muted-foreground hover:text-foreground transition-colors cursor-pointer shrink-0 rounded p-0.5 hover:bg-muted/50 active:scale-[0.95]"
        (click)="toastService.dismiss(toast.id)"
      >
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  }
</div>
