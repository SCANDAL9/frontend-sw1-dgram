<div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl shadow-lg border backdrop-blur-md transition-all duration-300 transform translate-y-0 opacity-100"
      [ngClass]="{
        'bg-zinc-900/95 border-zinc-700/80 text-zinc-100 dark:bg-zinc-800/95 dark:border-zinc-600': toast.type === 'info',
        'bg-emerald-950/95 border-emerald-700/80 text-emerald-100': toast.type === 'success',
        'bg-amber-950/95 border-amber-700/80 text-amber-100': toast.type === 'warning',
        'bg-rose-950/95 border-rose-700/80 text-rose-100': toast.type === 'error'
      }"
    >
      <!-- Icon -->
      <span class="shrink-0 mt-0.5 text-[14px]">
        @if (toast.type === 'success') {
          <svg class="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        } @else if (toast.type === 'warning') {
          <svg class="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        } @else if (toast.type === 'error') {
          <svg class="w-4 h-4 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        } @else {
          <svg class="w-4 h-4 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        }
      </span>

      <p class="text-[13px] font-medium leading-snug flex-1">{{ toast.message }}</p>

      <button
        class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition-colors cursor-pointer shrink-0"
        (click)="toastService.dismiss(toast.id)"
      >
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  }
</div>
