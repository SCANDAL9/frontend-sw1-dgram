<div class="relative">
  <div class="flex items-center gap-2.5 px-3 h-7 bg-[#fafafa] border-b border-transparent text-[11px] shrink-0">
    <span class="inline-flex items-center gap-1.5 text-zinc-500">
      <span class="w-1.5 h-1.5 rounded-full" [class.bg-emerald-500]="ws.online()" [class.bg-zinc-300]="!ws.online()"></span>
      @if (ws.online()) { {{ ws.peerCount() + 1 }} online } @else { Offline }
    </span>
    <div class="flex items-center gap-1">
      <div class="w-6 h-6 rounded-full flex items-center justify-center text-white font-semibold tracking-wide text-[10px] border border-white shadow-sm" style="background: #1E293B" title="You">U</div>
      @for (user of peers(); track user.user_id) {
        <div class="w-6 h-6 rounded-full flex items-center justify-center text-white font-bold text-[10px] border border-white shadow-sm" [style.background]="user.color" [title]="user.name">{{ user.name.charAt(0) }}</div>
      }
    </div>
    <div class="flex-1"></div>
    <button class="hidden items-center gap-1 px-2.5 py-1 rounded-full text-[11px] text-zinc-600 bg-zinc-50 border border-zinc-200 hover:bg-zinc-100 cursor-pointer" (click)="toggleChat()">
      Chat @if (ws.messages().length) { ({{ ws.messages().length }}) }
    </button>
  </div>
  @if (showChat()) {
    <div class="absolute left-0 right-0 top-full z-40 mx-3 mt-1 flex flex-col bg-white border border-[#a0aec0] rounded-sm shadow-lg overflow-hidden">
      <div class="px-3 py-1.5 text-[10px] font-semibold text-[#555] uppercase tracking-widest border-b border-[#e8eaf0] bg-[#f8f9fb]">Board chat</div>
      <div class="h-44 overflow-y-auto px-3 py-2 space-y-1 bg-white">
        @for (msg of ws.messages(); track $index) {
          <div class="text-[11px]"><span class="font-semibold" [style.color]="msg.color">{{ msg.name }}:</span><span class="text-[#1a1a1a] ml-1 break-words">{{ msg.text }}</span></div>
        }
        @empty { <div class="text-[11px] text-[#888] italic py-2 text-center">No messages yet</div> }
      </div>
      <div class="flex items-center gap-2 border-t border-[#d0d6e2] p-2 bg-[#f8f9fb]">
        <input type="text" class="flex-1 px-2 py-1 bg-white border border-[#a0aec0] rounded-sm text-[11px] text-[#1a1a1a] placeholder:text-[#888] outline-none focus:border-[#2b579a]" placeholder="Type a message..." [ngModel]="draft()" (ngModelChange)="draft.set($event)" (keyup.enter)="send()" />
        <button class="px-3 py-1 rounded-sm text-[11px] font-semibold bg-[#2b579a] text-white border border-[#1e3f6f] hover:bg-[#1e3f6f] cursor-pointer" (click)="send()">Send</button>
      </div>
    </div>
  }
</div>
