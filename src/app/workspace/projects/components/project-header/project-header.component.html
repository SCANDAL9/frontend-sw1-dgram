<header class="w-full h-14 shrink-0 flex items-center justify-between gap-4 px-6 sm:px-10 lg:px-16 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md border-b border-zinc-200/80 dark:border-zinc-800/80 sticky top-0 z-30">
  <!-- Brand / Logo -->
  <a routerLink="/" class="flex items-center gap-2.5 group shrink-0">
    <div class="w-8 h-8 rounded-lg bg-zinc-900 dark:bg-zinc-800 border border-zinc-800 dark:border-zinc-700 flex items-center justify-center shadow-xs group-hover:scale-105 transition-transform">
      <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="5" rx="9" ry="3" />
        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
      </svg>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="font-bold tracking-tight text-[15px] text-zinc-900 dark:text-zinc-100">dgram</span>
      <span class="text-[10px] font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded-md bg-zinc-100 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400 border border-zinc-200/60 dark:border-zinc-700/60">Studio</span>
    </div>
  </a>

  <!-- Center Search Bar -->
  <div class="flex-1 max-w-sm mx-auto hidden md:block">
    <div class="flex items-center gap-2 px-3 py-1.5 bg-zinc-100/90 dark:bg-zinc-800/80 border border-zinc-200/80 dark:border-zinc-700/80 rounded-lg focus-within:ring-2 focus-within:ring-zinc-400/30 focus-within:border-zinc-400 dark:focus-within:border-zinc-600 transition-all shadow-2xs">
      <svg class="w-3.5 h-3.5 text-zinc-400 dark:text-zinc-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        type="text"
        placeholder="Buscar tableros o esquemas..."
        class="w-full text-[12.5px] bg-transparent border-none outline-none text-zinc-900 dark:text-zinc-100 placeholder:text-zinc-400 dark:placeholder:text-zinc-500"
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQueryChange.emit($event)"
      />
      @if (searchQuery()) {
        <button
          type="button"
          class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 cursor-pointer shrink-0"
          (click)="searchQueryChange.emit('')"
          title="Limpiar búsqueda"
        >
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
        </button>
      } @else {
        <kbd class="hidden sm:inline-flex items-center text-[10px] font-mono px-1.5 py-0.5 rounded bg-zinc-200/80 dark:bg-zinc-700/80 text-zinc-500 dark:text-zinc-400 shrink-0 font-medium">⌘K</kbd>
      }
    </div>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-2.5 shrink-0">
    <!-- Theme Toggle -->
    <button
      type="button"
      class="w-8 h-8 rounded-lg flex items-center justify-center bg-white dark:bg-zinc-800/80 hover:bg-zinc-100 dark:hover:bg-zinc-700/80 text-zinc-600 dark:text-zinc-300 transition-colors cursor-pointer border border-zinc-200 dark:border-zinc-700/80 shadow-2xs"
      (click)="toggleTheme.emit()"
      [title]="isDark() ? 'Modo Claro' : 'Modo Oscuro'"
    >
      @if (isDark()) {
        <svg class="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>
      } @else {
        <svg class="w-4 h-4 text-zinc-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
      }
    </button>

    <!-- Auth State -->
    @if (currentUser(); as user) {
      <div class="flex items-center gap-2 pl-2 pr-1 py-1 bg-white dark:bg-zinc-800/80 rounded-lg border border-zinc-200 dark:border-zinc-700/80 text-[12px] shadow-2xs">
        <button
          type="button"
          class="flex items-center gap-2 bg-transparent border-0 cursor-pointer p-0 text-left"
          (click)="openProfile.emit()"
          title="Ver y editar perfil"
        >
          @if (user.avatar_url) {
            <img [src]="user.avatar_url" alt="Avatar" class="w-6 h-6 rounded-md object-cover" />
          } @else {
            <span class="w-6 h-6 rounded-md bg-zinc-900 dark:bg-zinc-700 text-white flex items-center justify-center text-[11px] font-bold">
              {{ user.full_name ? user.full_name.charAt(0).toUpperCase() : 'U' }}
            </span>
          }
          <span class="font-medium text-zinc-800 dark:text-zinc-200 hidden sm:inline hover:underline">{{ user.full_name }}</span>
        </button>
        <button class="w-6 h-6 rounded flex items-center justify-center text-zinc-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 transition-colors cursor-pointer" (click)="logout.emit()" title="Cerrar sesión">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
        </button>
      </div>
    } @else {
      <button
        type="button"
        class="px-3.5 py-1.5 rounded-lg text-[12.5px] font-medium bg-white dark:bg-zinc-800/80 text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-700/80 border border-zinc-200 dark:border-zinc-700/80 transition-colors cursor-pointer shadow-2xs"
        (click)="openAuth.emit()"
      >
        Iniciar Sesión
      </button>
    }

    <!-- Primary Action: New Board -->
    <button
      type="button"
      class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-[12.5px] font-semibold bg-zinc-900 hover:bg-zinc-800 dark:bg-white dark:text-zinc-900 dark:hover:bg-zinc-100 text-white transition-all cursor-pointer shadow-xs active:scale-95"
      (click)="createBoard.emit()"
    >
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
      <span>Nuevo Tablero</span>
    </button>
  </div>
</header>
