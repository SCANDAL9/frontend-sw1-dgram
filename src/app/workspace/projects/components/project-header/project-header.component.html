<header class="w-full h-15 shrink-0 flex items-center justify-between gap-4 px-6 sm:px-10 lg:px-12 bg-background/80 backdrop-blur-xl border-b border-border/80 sticky top-0 z-30 transition-all select-none">
  <!-- Brand / Logo -->
  <a routerLink="/" class="flex items-center gap-3 group shrink-0">
    <div class="w-8.5 h-8.5 rounded-xl bg-gradient-to-br from-primary via-primary to-primary/80 text-primary-foreground flex items-center justify-center shadow-xs shadow-primary/20 ring-1 ring-white/10 group-hover:scale-105 transition-all duration-200">
      <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="5" rx="9" ry="3" />
        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
      </svg>
    </div>
    <div class="flex items-center gap-2">
      <span class="font-bold tracking-tight text-base text-foreground">dgram</span>
      <span class="text-[10px] font-mono font-medium px-2 py-0.5 rounded-full bg-secondary/80 text-secondary-foreground border border-border/60">Studio</span>
    </div>
  </a>

  <!-- Center Search Bar (Command-bar style) -->
  <div class="flex-1 max-w-sm mx-auto hidden md:block">
    <div class="flex items-center gap-2.5 px-3.5 py-1.5 bg-secondary/40 hover:bg-secondary/60 focus-within:bg-background border border-border/70 focus-within:border-primary/50 focus-within:ring-2 focus-within:ring-primary/20 rounded-xl transition-all duration-150 shadow-2xs">
      <svg class="w-3.5 h-3.5 text-muted-foreground shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        type="text"
        placeholder="Buscar tableros o esquemas..."
        class="w-full text-xs bg-transparent border-none outline-none text-foreground placeholder:text-muted-foreground/70"
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQueryChange.emit($event)"
      />
      @if (searchQuery()) {
        <button
          type="button"
          class="text-muted-foreground hover:text-foreground cursor-pointer shrink-0"
          (click)="searchQueryChange.emit('')"
          title="Limpiar búsqueda"
        >
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
        </button>
      } @else {
        <kbd class="hidden sm:inline-flex items-center text-[10px] font-mono px-1.5 py-0.5 rounded-md bg-background text-muted-foreground border border-border/80 shadow-2xs font-semibold">⌘K</kbd>
      }
    </div>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-2.5 shrink-0">
    <!-- Theme Toggle -->
    <button
      type="button"
      class="w-8.5 h-8.5 rounded-xl flex items-center justify-center bg-secondary/60 hover:bg-secondary text-foreground transition-all cursor-pointer border border-border/70 shadow-2xs active:scale-[0.96] focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
      (click)="toggleTheme.emit()"
      [title]="isDark() ? 'Modo Claro' : 'Modo Oscuro'"
    >
      @if (isDark()) {
        <svg class="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>
      } @else {
        <svg class="w-4 h-4 text-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
      }
    </button>

    <!-- Auth State -->
    @if (currentUser(); as user) {
      <div class="flex items-center gap-2 pl-2 pr-1.5 py-1 bg-secondary/60 hover:bg-secondary rounded-xl border border-border/70 text-xs shadow-2xs transition-colors">
        <button
          type="button"
          class="flex items-center gap-2 bg-transparent border-0 cursor-pointer p-0 text-left active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none rounded"
          (click)="openProfile.emit()"
          title="Ver y editar perfil"
        >
          @if (user.avatar_url) {
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" [src]="user.avatar_url" alt="Avatar" class="w-6 h-6 rounded-md object-cover" />
          } @else {
            <span class="w-6 h-6 rounded-md bg-primary text-primary-foreground flex items-center justify-center text-[11px] font-bold shadow-2xs">
              {{ user.full_name ? user.full_name.charAt(0).toUpperCase() : 'U' }}
            </span>
          }
          <span class="font-medium text-foreground hidden sm:inline hover:underline">{{ user.full_name }}</span>
        </button>
        <button
          type="button"
          class="w-6 h-6 rounded flex items-center justify-center text-muted-foreground hover:text-destructive hover:bg-destructive/10 transition-colors cursor-pointer active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
          (click)="logout.emit()"
          title="Cerrar sesión"
        >
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
        </button>
      </div>
    } @else {
      <button
        type="button"
        class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-secondary/80 text-secondary-foreground hover:bg-secondary border border-border/70 transition-all cursor-pointer shadow-2xs active:scale-[0.97] focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
        (click)="openAuth.emit()"
      >
        Iniciar Sesión
      </button>
    }

    <!-- Primary Action: New Board -->
    <button
      type="button"
      class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-semibold bg-primary hover:bg-primary/90 text-primary-foreground transition-all cursor-pointer shadow-sm shadow-primary/20 active:scale-[0.97] focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
      (click)="createBoard.emit()"
    >
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
      <span>Nuevo Tablero</span>
    </button>
  </div>
</header>
